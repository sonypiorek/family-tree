<style>

  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ground:#131715;
      --surface:#1D2320;
      --ink:#E8ECE9;
      --muted:#8F9C95;
      --edge:#343D38;
      --dot:#242C28;
      --spouse:#5C6862;
      --accent:#57B394;
      --btn-bg:#1D2320;
      --btn-hover:#28302C;

      --card-shadow:drop-shadow(0 2px 4px rgba(0,0,0,.45));
    }
  }
  :root[data-theme="dark"]{
    --ground:#131715;
    --surface:#1D2320;
    --ink:#E8ECE9;
    --muted:#8F9C95;
    --edge:#343D38;
    --dot:#242C28;
    --spouse:#5C6862;
    --accent:#57B394;
    --btn-bg:#1D2320;
    --btn-hover:#28302C;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 2px 8px rgba(0,0,0,.25);
    --card-shadow:drop-shadow(0 2px 4px rgba(0,0,0,.45));
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--ground);color:var(--ink);}
  body{
    font-family:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    padding:0 16px 16px;
  }
  .bar{
    width:100%;
    max-width:1400px;
    margin:0 auto;
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:12px 16px;
    flex-wrap:wrap;
    padding-block:20px 14px;
  }
  h1{
    font-family:'Bricolage Grotesque','Instrument Sans',system-ui,sans-serif;
    font-weight:600;
    font-size:24px;
    letter-spacing:-0.01em;
    margin:0;
    text-wrap:balance;
  }
  .subtitle{color:var(--muted);font-size:13.5px;margin-top:3px;font-variant-numeric:tabular-nums;}
  .controls{display:flex;gap:8px;}
  .controls button{
    font-family:inherit;
    font-size:14px;
    font-weight:500;
    color:var(--ink);
    background:var(--btn-bg);
    border:1px solid var(--edge);
    border-radius:8px;
    min-width:34px;
    height:34px;
    padding:0 12px;
    cursor:pointer;
    box-shadow:var(--shadow);
  }
  .controls button:hover{background:var(--btn-hover);}
  .controls button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  #viewport{
    position:relative;
    width:100%;
    max-width:1400px;
    margin:0 auto;
    flex:1;
    min-height:440px;
    height:calc(100vh - 140px);
    background-color:var(--surface);
    background-image:radial-gradient(var(--dot) 1.1px, transparent 1.1px);
    background-size:26px 26px;
    border:1px solid var(--edge);
    border-radius:12px;
    overflow:hidden;
    cursor:grab;
    touch-action:none;
  }
  #viewport.dragging{cursor:grabbing;}
  #viewport svg{position:absolute;inset:0;width:100%;height:100%;display:block;}
  .empty-state{
    max-width:440px;
    margin:40px auto 0;
    text-align:center;
    color:var(--muted);
    line-height:1.6;
    font-size:15px;
  }
  .person-card{
    fill:var(--surface);
    stroke:var(--edge);
    stroke-width:1;
    filter:var(--card-shadow);
  }
  .person-name{
    font-size:13px;
    font-weight:600;
    fill:var(--ink);
    font-family:'Instrument Sans',system-ui,sans-serif;
  }
  .person-years{
    font-size:11.5px;
    fill:var(--muted);
    font-family:'Instrument Sans',system-ui,sans-serif;
    font-variant-numeric:tabular-nums;
  }
  .link-parent{
    stroke:var(--spouse);
    stroke-width:1.5;
    fill:none;
    stroke-linecap:round;
  }
  .link-spouse{
    stroke:var(--spouse);
    stroke-width:1.4;
    stroke-dasharray:2 4;
    stroke-linecap:round;
  }
  #tooltip{
    position:absolute;
    z-index:5;
    display:none;
    background:var(--ink);
    color:var(--ground);
    font-size:12px;
    font-weight:500;
    padding:4px 10px;
    border-radius:6px;
    pointer-events:none;
    white-space:nowrap;
  }
</style>
</head>

// ---------------------------------------------------------
// Layout engine — assigns each person a generation (row) based on
// parent/child depth, then positions people left-to-right within
// each row, keeping spouses adjacent and children under parents.
// ---------------------------------------------------------
const measureCanvas = document.createElement('canvas');
const measureCtx = measureCanvas.getContext('2d');
function textWidth(text, font){
  measureCtx.font = font;
  return measureCtx.measureText(text || '').width;
}

const CARD_H = 54, SPOUSE_GAP = 14, CARD_PAD_X = 14, CARD_MIN_W = 130, CARD_MAX_W = 280;
const COL_GUT = 44, TOP_GAP = 56, ROOT_GAP_X = 160;

const BRANCH_PALETTE = ['#2F8C71','#D0684B','#C79436','#5C8CD5','#A16BC4','#3FA4C9','#7DA653','#C4638F'];

function yearsText(p){
  if(p.birth && p.death) return `${p.birth}–${p.death}`;
  if(p.birth) return `ur. ${p.birth}`;
  if(p.death) return `zm. ${p.death}`;
  return '';
}

function cardWidth(p){
  const nameFont = '600 13px "Instrument Sans", system-ui, sans-serif';
  const yearsFont = '11.5px "Instrument Sans", system-ui, sans-serif';
  const w = Math.max(textWidth(p.name, nameFont), textWidth(yearsText(p), yearsFont)) + CARD_PAD_X * 2 + 24;
  return Math.min(CARD_MAX_W, Math.max(CARD_MIN_W, Math.ceil(w)));
}

function computeLayout(people){
  const byId = Object.fromEntries(people.map(p => [p.id, p]));

  // generation = 0 for people with no parents in the dataset,
  // else 1 + max(parent generations)
  const genCache = {};
  function getGen(id, seen = new Set()){
    if(genCache[id] !== undefined) return genCache[id];
    if(seen.has(id)) return 0; // cycle guard
    seen.add(id);
    const p = byId[id];
    if(!p || !p.parents || p.parents.length === 0){
      genCache[id] = 0;
      return 0;
    }
    const gens = p.parents.filter(pid => byId[pid]).map(pid => getGen(pid, seen));
    const g = gens.length ? Math.max(...gens) + 1 : 0;
    genCache[id] = g;
    return g;
  }
  people.forEach(p => getGen(p.id));

  // married-in spouses have no parents in the dataset, so they'd default
  // to generation 0 — pull them onto their partner's row instead
  for(let pass = 0; pass < 4; pass++){
    people.forEach(p => {
      (p.spouses||[]).forEach(sid => {
        if(!byId[sid]) return;
        const g = Math.max(genCache[p.id], genCache[sid]);
        genCache[p.id] = g;
        genCache[sid] = g;
      });
    });
  }

  // group by generation
  const rows = {};
  people.forEach(p => {
    const g = genCache[p.id];
    rows[g] = rows[g] || [];
    rows[g].push(p.id);
  });
  const maxGen = Math.max(0, ...Object.keys(rows).map(Number));

  // Color-code lineages: children of these parent nodes (in priority order)
  // each found a colored branch; the color then flows down through every
  // descendant and sideways to married-in spouses, so a lineage reads as one.
  const BRANCH_PARENT_SETS = [
    ['jozef-rogowski', 'katarzyna-rogowska'],
    ['rodzice-rogowscy'],
    ['jozef-skrzypiec', 'zona-jozefa-skrzypca'],
    ['rodzice-skrzypcowie'],
  ];
  const branchColor = {};
  let colorIdx = 0;
  BRANCH_PARENT_SETS.forEach(set => {
    people.forEach(p => {
      if(branchColor[p.id]) return;
      if((p.parents || []).some(pid => set.includes(pid))){
        branchColor[p.id] = BRANCH_PALETTE[colorIdx++ % BRANCH_PALETTE.length];
      }
    });
  });
  for(let gnum = 0; gnum <= maxGen; gnum++){
    (rows[gnum] || []).forEach(id => {
      if(!branchColor[id]){
        const parentWithColor = (byId[id].parents || []).find(pid => branchColor[pid]);
        if(parentWithColor) branchColor[id] = branchColor[parentWithColor];
      }
    });
    (rows[gnum] || []).forEach(id => {
      (byId[id].spouses || []).forEach(sid => {
        if(branchColor[id] && byId[sid] && !branchColor[sid]) branchColor[sid] = branchColor[id];
      });
    });
  }

  // ---- family-cluster layout ----
  // A "unit" is one person plus their married-in spouses; their children's
  // units nest below as a cluster. When a family's children get too wide,
  // they wrap onto additional rows (shelves), so the tree grows vertically
  // instead of stretching into one enormous generation-wide row.
  const attachedTo = {};
  people.forEach(p => {
    if(attachedTo[p.id]) return;
    (p.spouses || []).forEach(sid => {
      const s = byId[sid];
      if(!s || attachedTo[sid] || sid === p.id) return;
      const marriedIn = !(s.parents || []).some(pid => byId[pid]);
      // a spouse with known parents can still sit beside their partner as
      // long as all their children are shared with this partner — their own
      // parents then reach them with a long-range link across clusters
      const childrenShared = people.every(ch => {
        const par = ch.parents || [];
        return !par.includes(sid) || par.includes(p.id);
      });
      if(marriedIn || childrenShared) attachedTo[sid] = p.id;
    });
  });

  const unitByHead = {};
  const unitList = [];
  people.forEach(p => {
    if(attachedTo[p.id]) return;
    const u = { head: p, members: [p], children: [], childGroups: [], columns: [] };
    unitByHead[p.id] = u;
    unitList.push(u);
  });
  people.forEach(p => {
    if(attachedTo[p.id]) unitByHead[attachedTo[p.id]].members.push(p);
  });

  // hand each full-sibling group to the unit of the parent it hangs under
  const groupsByKey = {};
  people.forEach(p => {
    const par = (p.parents || []).filter(pid => byId[pid]);
    if(!par.length) return;
    const key = par.slice().sort().join(',');
    (groupsByKey[key] = groupsByKey[key] || { parents: par, kids: [] }).kids.push(p);
  });
  Object.values(groupsByKey).forEach(gr => {
    const ownerId = gr.parents.find(pid => unitByHead[pid]) || attachedTo[gr.parents[0]];
    const owner = unitByHead[ownerId];
    gr.kids.forEach(k => { const cu = unitByHead[k.id]; if(cu) owner.children.push(cu); });
    owner.childGroups.push(gr);
  });

  function layoutUnit(u){
    const mw = u.members.map(cardWidth);
    u.coupleW = mw.reduce((a,b) => a+b, 0) + SPOUSE_GAP * (u.members.length - 1);
    u.memberPos = [];
    let cx = 0;
    u.members.forEach((m,i) => { u.memberPos.push({ id: m.id, x: cx, w: mw[i] }); cx += mw[i] + SPOUSE_GAP; });

    if(!u.children.length){
      u.coupleX = 0; u.w = u.coupleW; u.h = CARD_H;
      return;
    }
    u.children.forEach(layoutUnit);
    // All sibling clusters sit side by side, top-aligned — no family is
    // ever pushed below another family's branch. Shallow clusters lean
    // left, the deepest to the right; the tree grows as wide as it needs.
    const orderIdx = new Map(u.children.map((c, i) => [c, i]));
    const sorted = u.children.slice().sort((a, b) => (a.h - b.h) || (orderIdx.get(a) - orderIdx.get(b)));
    let bx = 0;
    u.columns = sorted.map(c => {
      const cl = { items: [c], w: c.w, h: c.h, x: bx + COL_GUT };
      bx = cl.x + c.w;
      c.relY = 0;
      c.col = cl;
      return cl;
    });
    u.coupleX = Math.max(0, (bx - u.coupleW) / 2);
    u.w = Math.max(bx, u.coupleX + u.coupleW);
    u.h = CARD_H + TOP_GAP + Math.max(...u.columns.map(cl => cl.h));
  }

  const pos = {};
  function placeUnit(u, ox, oy){
    u.absX = ox; u.absY = oy;
    u.memberPos.forEach(mp => { pos[mp.id] = { x: ox + u.coupleX + mp.x, y: oy, w: mp.w }; });
    u.columns.forEach(cl => cl.items.forEach(c => placeUnit(c, ox + cl.x, oy + CARD_H + TOP_GAP + c.relY)));
  }

  // root families sit side by side, left to right
  const roots = unitList.filter(u => !(u.head.parents || []).some(pid => byId[pid]));
  let rx = 0, height = 1;
  roots.forEach(r => {
    layoutUnit(r);
    placeUnit(r, rx, 0);
    rx += r.w + ROOT_GAP_X;
    height = Math.max(height, r.h);
  });
  const width = Math.max(1, rx - ROOT_GAP_X);

  // ---- connector paths ----
  const links = [];
  let outerRails = 0;
  unitList.forEach(u => {
    u.childGroups.forEach((gr, gi) => {
      const anchorIds = gr.parents.filter(pid => (unitByHead[pid] || unitByHead[attachedTo[pid]]) === u);
      const aps = (anchorIds.length ? anchorIds : gr.parents).map(pid => pos[pid]);
      const anchorX = aps.reduce((s,p) => s + p.x + p.w/2, 0) / aps.length;
      const anchorY = Math.max(...aps.map(p => p.y)) + CARD_H;
      const color = branchColor[gr.kids[0].id] || null;
      const off = TOP_GAP * (gi + 1) / (u.childGroups.length + 1);

      const localKids = [];
      const remote = [];
      gr.kids.forEach(k => {
        const cu = unitByHead[k.id];
        if(cu && cu.col && u.children.includes(cu)) localKids.push(cu);
        else remote.push(k);
      });

      // long-range links to children displayed beside a spouse in another
      // cluster: routed over the top of the tree, then straight down into
      // the child's card
      remote.forEach(k => {
        const kp = pos[k.id];
        if(!kp) return;
        const kcx = kp.x + kp.w/2;
        const upY = -28 - (outerRails++) * 12;
        const parTop = Math.min(...aps.map(p => p.y));
        links.push({ d: `M ${anchorX} ${parTop} L ${anchorX} ${upY} L ${kcx} ${upY} L ${kcx} ${kp.y}`, color: branchColor[k.id] || color });
      });
      if(!localKids.length) return;

      const kidPt = cu => { const hp = pos[cu.head.id]; return { x: hp.x + hp.w/2, y: hp.y }; };

      if(localKids.length === 1){
        const p1 = kidPt(localKids[0]);
        const midY = p1.y - 12 - gi * 7;
        if(Math.abs(p1.x - anchorX) < 1){
          links.push({ d: `M ${anchorX} ${anchorY} L ${anchorX} ${p1.y}`, color });
        } else {
          links.push({ d: `M ${anchorX} ${anchorY} L ${anchorX} ${midY} L ${p1.x} ${midY} L ${p1.x} ${p1.y}`, color });
        }
      } else {
        // children are top-aligned side by side: trunk down to a bus, then
        // a vertical drop into each child's card top
        const bandY = u.absY + CARD_H + off;
        const pts = localKids.map(kidPt);
        const minX = Math.min(anchorX, ...pts.map(p => p.x));
        const maxX = Math.max(anchorX, ...pts.map(p => p.x));
        links.push({ d: `M ${anchorX} ${anchorY} L ${anchorX} ${bandY}`, color });
        if(maxX > minX) links.push({ d: `M ${minX} ${bandY} L ${maxX} ${bandY}`, color });
        pts.forEach(p => links.push({ d: `M ${p.x} ${bandY} L ${p.x} ${p.y}`, color }));
      }
    });
  });

  return { pos, CARD_H, maxGen, width, height, branchColor, links, gen: genCache };
}

const SVGNS = 'http://www.w3.org/2000/svg';
const ROMAN = ['I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII'];

function render(){
  const viewport = document.getElementById('viewport');
  const emptyState = document.getElementById('empty');
  viewport.innerHTML = '';

  if(!people.length){
    emptyState.style.display = 'block';
    viewport.style.display = 'none';
    return;
  }
  emptyState.style.display = 'none';
  viewport.style.display = '';

  const { pos, CARD_H, maxGen, width, height, branchColor, links, gen } = computeLayout(people);

  const plOsoby = n => { const u = n%10, t = n%100; if(n===1) return 'osoba'; if(u>=2 && u<=4 && (t<12 || t>14)) return 'osoby'; return 'osób'; };
  const plPokolen = n => { const u = n%10, t = n%100; if(n===1) return 'pokolenie'; if(u>=2 && u<=4 && (t<12 || t>14)) return 'pokolenia'; return 'pokoleń'; };
  document.getElementById('stats').textContent =
    `${people.length} ${plOsoby(people.length)} · ${maxGen+1} ${plPokolen(maxGen+1)} · rodzina Rogowskich i linie potomne`;

  const PAD = 60;
  const worldW = width + PAD * 2;
  const worldH = height + PAD * 2;

  const svg = document.createElementNS(SVGNS,'svg');
  const camera = document.createElementNS(SVGNS,'g');
  svg.appendChild(camera);
  const g = document.createElementNS(SVGNS,'g');
  g.setAttribute('transform', `translate(${PAD},${PAD})`);
  camera.appendChild(g);

  function center(id){
    const p = pos[id];
    return { x: p.x + p.w/2, y: p.y + CARD_H/2 };
  }
  function topCenter(id){
    const p = pos[id];
    return { x: p.x + p.w/2, y: p.y };
  }
  function bottomCenter(id){
    const p = pos[id];
    return { x: p.x + p.w/2, y: p.y + CARD_H };
  }

  function path(d, cls, color){
    const el = document.createElementNS('http://www.w3.org/2000/svg','path');
    el.setAttribute('class', cls);
    el.setAttribute('d', d);
    if(color) el.style.stroke = color;
    g.appendChild(el);
  }

  // parent -> children connectors (already computed by the cluster layout)
  links.forEach(l => path(l.d, 'link-parent', l.color));

  // spouse links
  const drawnSpousePairs = new Set();
  people.forEach(p => {
    (p.spouses||[]).forEach(sid => {
      if(!pos[sid]) return;
      const key = [p.id, sid].sort().join('|');
      if(drawnSpousePairs.has(key)) return;
      drawnSpousePairs.add(key);
      const c1 = center(p.id), c2 = center(sid);
      const line = document.createElementNS('http://www.w3.org/2000/svg','line');
      line.setAttribute('class','link-spouse');
      line.setAttribute('x1', c1.x); line.setAttribute('y1', c1.y);
      line.setAttribute('x2', c2.x); line.setAttribute('y2', c2.y);
      g.appendChild(line);
    });
  });

  // hover tooltip: shows which generation a person belongs to
  const tip = document.createElement('div');
  tip.id = 'tooltip';

  // person cards
  people.forEach(p => {
    const { x, y, w } = pos[p.id];
    const card = document.createElementNS(SVGNS,'g');
    card.setAttribute('transform', `translate(${x},${y})`);

    const rect = document.createElementNS(SVGNS,'rect');
    rect.setAttribute('class','person-card');
    rect.setAttribute('width', w);
    rect.setAttribute('height', CARD_H);
    rect.setAttribute('rx', 8);
    card.appendChild(rect);

    const yt = yearsText(p);
    const nameY = yt ? 22 : CARD_H/2 + 4.5;

    const dot = document.createElementNS(SVGNS,'circle');
    dot.setAttribute('cx', CARD_PAD_X + 4);
    dot.setAttribute('cy', nameY - 4.5);
    dot.setAttribute('r', 3.5);
    dot.setAttribute('fill', branchColor[p.id] || 'var(--accent)');
    card.appendChild(dot);

    const name = document.createElementNS(SVGNS,'text');
    name.setAttribute('class','person-name');
    name.setAttribute('x', CARD_PAD_X + 16);
    name.setAttribute('y', nameY);
    name.textContent = p.name;
    card.appendChild(name);

    if(yt){
      const years = document.createElementNS(SVGNS,'text');
      years.setAttribute('class','person-years');
      years.setAttribute('x', CARD_PAD_X + 16);
      years.setAttribute('y', 39);
      years.textContent = yt;
      card.appendChild(years);
    }

    card.onpointerenter = () => {
      tip.textContent = `Pokolenie ${ROMAN[gen[p.id]] || gen[p.id] + 1}`;
      tip.style.display = 'block';
    };
    card.onpointermove = e => {
      const r = viewport.getBoundingClientRect();
      tip.style.left = (e.clientX - r.left + 14) + 'px';
      tip.style.top = (e.clientY - r.top + 16) + 'px';
    };
    card.onpointerleave = () => { tip.style.display = 'none'; };

    g.appendChild(card);
  });

  // --- pan & zoom ---
  const view = { x: 0, y: 0, k: 1 };
  function applyView(){
    camera.setAttribute('transform', `translate(${view.x} ${view.y}) scale(${view.k})`);
  }
  function fit(){
    const vw = viewport.clientWidth || 800, vh = viewport.clientHeight || 500;
    const k = Math.min(vw / worldW, vh / worldH, 1.15);
    view.k = k;
    view.x = (vw - worldW * k) / 2;
    view.y = Math.max((vh - worldH * k) / 2, 8);
    applyView();
  }
  function zoomAt(px, py, factor){
    const k2 = Math.min(3, Math.max(0.06, view.k * factor));
    const f = k2 / view.k;
    view.x = px - (px - view.x) * f;
    view.y = py - (py - view.y) * f;
    view.k = k2;
    applyView();
  }

  viewport.onwheel = e => {
    e.preventDefault();
    const r = viewport.getBoundingClientRect();
    zoomAt(e.clientX - r.left, e.clientY - r.top, Math.exp(-e.deltaY * 0.0018));
  };

  const pointers = new Map();
  let lastMid = null, lastDist = null;
  viewport.onpointerdown = e => {
    tip.style.display = 'none';
    viewport.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if(pointers.size === 1) viewport.classList.add('dragging');
    lastMid = null; lastDist = null;
  };
  viewport.onpointermove = e => {
    if(!pointers.has(e.pointerId)) return;
    const prev = pointers.get(e.pointerId);
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if(pointers.size === 1){
      view.x += e.clientX - prev.x;
      view.y += e.clientY - prev.y;
      applyView();
    } else if(pointers.size === 2){
      const pts = [...pointers.values()];
      const mid = { x: (pts[0].x + pts[1].x)/2, y: (pts[0].y + pts[1].y)/2 };
      const dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
      if(lastMid){
        view.x += mid.x - lastMid.x;
        view.y += mid.y - lastMid.y;
        applyView();
        const r = viewport.getBoundingClientRect();
        if(lastDist) zoomAt(mid.x - r.left, mid.y - r.top, dist / lastDist);
      }
      lastMid = mid; lastDist = dist;
    }
  };
  const endPointer = e => {
    pointers.delete(e.pointerId);
    if(pointers.size === 0) viewport.classList.remove('dragging');
    lastMid = null; lastDist = null;
  };
  viewport.onpointerup = endPointer;
  viewport.onpointercancel = endPointer;

  document.getElementById('zoom-in').onclick = () => zoomAt(viewport.clientWidth/2, viewport.clientHeight/2, 1.3);
  document.getElementById('zoom-out').onclick = () => zoomAt(viewport.clientWidth/2, viewport.clientHeight/2, 1/1.3);
  document.getElementById('zoom-fit').onclick = fit;

  viewport.appendChild(svg);
  viewport.appendChild(tip);

  // initial view: top of the tree, centered on the root card, readable zoom
  (function home(){
    const vw = viewport.clientWidth || 800, vh = viewport.clientHeight || 500;
    view.k = Math.min(1, vw / 1250);
    if(worldW * view.k <= vw){
      view.x = (vw - worldW * view.k) / 2;
    } else {
      const rootP = pos[people[0].id];
      const rootCx = (rootP.x + rootP.w/2 + PAD) * view.k;
      view.x = Math.max(vw - worldW * view.k - 8, Math.min(8, vw/2 - rootCx));
    }
    view.y = Math.max((vh - worldH * view.k) / 2, 12);
    applyView();
  })();
}

render();
// re-render once the web fonts arrive so card widths are measured with the real face
if(document.fonts && document.fonts.ready) document.fonts.ready.then(() => render());
</script>

</body>
</html>
